model:
  name: "vidore/colpali-v1.3-hf"
  embedding_dim: 128            # ColPali late-interaction vector dimension (D)
  projection_dim: 512           # Dimension for fusion and reasoning layers
  device: "cuda"                # "cuda" or "cpu"
  dtype: "bfloat16"             # "bfloat16", "float16", or "float32"
  quantize_4bit: false           # Set true for 4-bit quantization on local 4GB GPU
  
fusion:
  num_heads: 4                  # Number of attention heads for simple fusion
  dropout: 0.1

decoder:
  num_classes: 2                # For span prediction (start and end logits)
  max_answer_len: 20            # Max length of predicted answer span

dual_stream:
  num_heads: 4                  # Number of heads for cross and self-attention
  num_layers: 1                 # Number of transformer layers in Stream B
  dropout: 0.1

reranker:                       # MaxSim-anchored multi-hop page reranker (novelty)
  num_heads: 4
  num_layers: 2                 # cross-page reasoning "hops"
  dropout: 0.1

reader:                                          # Stage-B PaliGemma reader (retrieve-then-read)
  model_name: "google/paligemma-3b-mix-448"      # VQA-tuned mix model (strong zero-shot ANLS)
  prompt_template: "answer en {question}"        # PaliGemma task-prefixed VQA prompt
  max_new_tokens: 20
  use_lora: true
  load_4bit: true                                # QLoRA on a 24GB GPU
  attn_implementation: "eager"                   # avoids SDPA dtype crash under 4-bit; "sdpa" is faster if it works
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

