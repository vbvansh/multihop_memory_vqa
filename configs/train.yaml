training:
  batch_size: 8
  epochs: 200
  lr: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  num_hops: 3                  # Number of reasoning attention hops
  lambda_page: 1.0             # Weight for supervised page-selection loss (answer_page_idx)
  lambda_sparsity: 0.3         # Weight for active memory ratio loss
  lambda_entropy: 0.01         # Weight for policy router confidence loss
  target_sparsity: 0.25        # Target 25% active chunks (1 page out of 4)
  max_val_samples: 1000        # Slice the 5K validation set to the first 1K samples
  max_train_samples: 1000       # Limit training to the first 1000 samples for debug
  run_val: true                # Enable validation during debugging
  run_test: false               # Disable final test evaluation during debugging

reranker_training:             # MaxSim-anchored page reranker (run via: python train_reranker.py)
  batch_size: 16
  epochs: 50
  lr: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0

reader_training:               # Stage-B PaliGemma reader (run via: python train_reader.py)
  batch_size: 1                # physical batch of single-page images (memory-safe on a shared GPU)
  grad_accum: 16               # effective batch = batch_size * grad_accum (unchanged at 16)
  epochs: 3
  lr: 2e-4                     # LoRA learning rate
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 20
  router_checkpoint: ""        # set to a router checkpoint_best.pt for end-to-end eval; empty = oracle-only
  skip_zeroshot: false         # true = skip the pre-training zero-shot eval (saves ~28 min on retries)

debug:
  enable: false                # Set true to run local quick validation / overfit test
  use_precomputed_embeddings: true # Read precomputed embeddings to bypass backbone
  precomputed_dir: "/c/ujjwalb/Vansh/Datasets/MPDoc_VQA_Dataset/precomputed_embeddings"
  num_samples: 200              # Number of samples to load in debug overfit mode
  data_dir: "./debug_data/raw_pdfs/mpdocvqa_subset_multipage"     # Directory containing 20-sample multipage subset

paths:
  train_data_json: "/c/ujjwalb/Vansh/Datasets/MPDoc_VQA_Dataset/qas/train.json"
  val_data_json: "/c/ujjwalb/Vansh/Datasets/MPDoc_VQA_Dataset/qas/val.json"
  test_data_json: "/c/ujjwalb/Vansh/Datasets/MPDoc_VQA_Dataset/qas/test.json"
  images_dir: "/c/ujjwalb/Vansh/Datasets/MPDoc_VQA_Dataset/images"
  logs_dir: "/c/ujjwalb/Vansh/multihop_memory_vqa/logs"
  checkpoints_dir: "/c/ujjwalb/Vansh/multihop_memory_vqa/checkpoints"
